<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin Yayasan Abu Ahsan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #121212; --teal: #8A6210; --teal-dark: #6B4A0B; --mint: #F6EED8; --gold: #E2A826;
  --paper: #FAF8F2; --white: #FFFFFF; --muted: #5A5648; --line: #E6DCC0; --danger: #A3261C;
  --display: "Source Serif 4", Georgia, serif;
  --body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.2; text-wrap: balance; }
h3 { font-size: 20px; }
a { color: var(--teal-dark); }
button, input, select, textarea { font: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
header { background: var(--ink); color: #fff; }
header .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; padding-bottom: 16px; }
header h1 { font-size: 22px; }
header a { color: var(--gold); }
main { padding: 28px 0 40px; display: grid; gap: 24px; }
.card { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 14px; }
.login { max-width: 420px; margin: 0 auto; }
label { display: grid; gap: 4px; font-weight: 600; font-size: 15px; }
.hint { color: var(--muted); font-size: 14px; font-weight: 400; }
input, select, textarea { padding: 10px 12px; border: 1px solid #C9BD98; border-radius: 8px; background: #fff; color: var(--ink); width: 100%; min-width: 0; }
textarea { min-height: 84px; resize: vertical; }
.btn { display: inline-block; border: 2px solid transparent; border-radius: 8px; padding: 10px 18px; font-weight: 600; cursor: pointer; background: var(--ink); color: #fff; }
.btn:hover { background: #2B2B2B; }
.btn.gold { background: var(--gold); color: #1A1405; }
.btn.gold:hover { background: #F0BC45; }
.btn.line { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.line:hover { background: var(--mint); }
.btn.small { padding: 6px 12px; font-size: 14px; }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.msg { padding: 10px 14px; border-radius: 8px; font-size: 15px; }
.msg.err { background: #FBE9E7; color: var(--danger); }
.msg.ok { background: #E7F4E4; color: #20551A; }
.msg.info { background: var(--mint); color: var(--teal-dark); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--mint); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--teal-dark); }
tbody tr:last-child td { border-bottom: 0; }
td.empty { color: var(--muted); text-align: center; padding: 22px; }
td textarea { min-height: 64px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; }
.check input { width: 20px; height: 20px; margin-top: 3px; flex: none; }
.tabs { display: flex; gap: 4px 6px; flex-wrap: wrap; border-bottom: 2px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 11px 16px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.fields { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
.fields .full { grid-column: 1 / -1; }
.panel { display: grid; gap: 22px; }
.savebar { position: sticky; bottom: 0; background: rgba(250,248,242,.96); border-top: 1px solid var(--line); padding: 12px 0; z-index: 5; }
[hidden] { display: none !important; }
@media (max-width: 640px) { .fields { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Admin Yayasan Abu Ahsan</h1>
    <div class="row"><a href="index.html">Lihat website</a><button type="button" class="btn line small" id="logout" hidden style="color:#fff;border-color:#fff">Keluar</button></div>
  </div>
</header>

<main class="wrap">
  <div id="setup" class="msg err" hidden>Firebase belum dikonfigurasi. Isi file <b>firebase-config.js</b> dulu, lalu muat ulang halaman ini.</div>

  <section class="card login" id="loginCard" hidden>
    <h2>Masuk admin</h2>
    <form id="loginForm" novalidate>
      <div style="display:grid;gap:14px">
        <label for="email">Email<input id="email" type="email" autocomplete="username" required></label>
        <label for="password">Kata sandi<input id="password" type="password" autocomplete="current-password" required></label>
        <div class="row">
          <button type="submit" class="btn gold" id="loginBtn">Masuk</button>
          <button type="button" class="btn line" id="resetBtn">Lupa kata sandi</button>
        </div>
        <div id="loginMsg" role="status"></div>
      </div>
    </form>
  </section>

  <div id="editor" hidden style="display:grid;gap:22px">
    <div class="msg info">Ubah isi di tiap tab, lalu tekan <b>Simpan ke website</b>. Perubahan langsung tampil di website. Kosongkan kolom teks untuk kembali ke teks awal.</div>
    <div class="tabs" role="tablist" aria-label="Bagian website" id="tabs"></div>
    <div id="panels"></div>
    <div class="savebar">
      <div class="row">
        <button type="button" class="btn gold" id="saveBtn">Simpan ke website</button>
        <span id="saveMsg" role="status"></span>
      </div>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, configReady } from "./firebase-config.js";
import { GROUPS, LISTS } from "./site-fields.js";

const $ = (id) => document.getElementById(id);

const PANELS = [
  { id: "beranda", title: "Beranda", groups: ["beranda"] },
  { id: "tentang", title: "Tentang", groups: ["tentang"] },
  { id: "kegiatan", title: "Kegiatan", groups: ["kegiatan"] },
  { id: "agenda", title: "Agenda", lists: [["majelis", "Jadwal Majelis Taklim"], ["pemuda", "Agenda Pembinaan Pemuda"]] },
  { id: "pengumuman", title: "Pengumuman", lists: [["pengumuman", "Daftar pengumuman"]], note: "Pengumuman tampil di bagian atas halaman depan. Kosongkan semua baris untuk menyembunyikan bagian ini." },
  { id: "pkbm", title: "PKBM", groups: ["pkbm"], lists: [["pengurus", "Pengurus PKBM"], ["siswa", "Siswa/i"], ["jadwal", "Jadwal pembelajaran PKBM"]], siswaOption: true },
  { id: "kontak", title: "Kontak", groups: ["kontak"] }
];

const values = {};   // teks yang sedang diedit, per kunci
const lists = { pengurus: [], siswa: [], jadwal: [], majelis: [], pemuda: [], pengumuman: [] };
let dirty = false;

function show(el, text, kind) { el.className = "msg " + kind; el.textContent = text; }
function markDirty() { dirty = true; }
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

function renderList(key) {
  const table = $("t-" + key), cfg = LISTS[key];
  while (table.firstChild) table.removeChild(table.firstChild);
  const thead = document.createElement("thead"), hr = document.createElement("tr");
  cfg.cols.forEach(([, label]) => { const th = document.createElement("th"); th.scope = "col"; th.textContent = label; hr.appendChild(th); });
  const thx = document.createElement("th"); thx.scope = "col"; thx.textContent = "Aksi"; hr.appendChild(thx);
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = document.createElement("tbody");
  if (!lists[key].length) {
    const tr = document.createElement("tr"), td = document.createElement("td");
    td.className = "empty"; td.colSpan = cfg.cols.length + 1; td.textContent = "Belum ada data. Tekan Tambah baris.";
    tr.appendChild(td); tbody.appendChild(tr);
  }
  lists[key].forEach((row, i) => {
    const tr = document.createElement("tr");
    cfg.cols.forEach(([field, label, type]) => {
      const td = document.createElement("td");
      let input;
      if (Array.isArray(type)) {
        input = document.createElement("select");
        type.forEach((o) => { const op = document.createElement("option"); op.value = o; op.textContent = o || "Pilih paket"; input.appendChild(op); });
      } else if (type === "textarea") {
        input = document.createElement("textarea");
      } else {
        input = document.createElement("input"); input.type = "text";
      }
      input.value = row[field] || "";
      input.setAttribute("aria-label", label + " baris " + (i + 1));
      const upd = () => { row[field] = input.value; markDirty(); };
      input.addEventListener("input", upd);
      input.addEventListener("change", upd);
      td.appendChild(input); tr.appendChild(td);
    });
    const tdx = document.createElement("td");
    const del = document.createElement("button");
    del.type = "button"; del.className = "btn danger small"; del.textContent = "Hapus";
    del.addEventListener("click", () => { lists[key].splice(i, 1); markDirty(); renderList(key); });
    tdx.appendChild(del); tr.appendChild(tdx); tbody.appendChild(tr);
  });
  table.appendChild(tbody);
}

function buildPanels() {
  const tabs = $("tabs"), panels = $("panels");
  PANELS.forEach((p, idx) => {
    const tab = document.createElement("button");
    tab.type = "button"; tab.setAttribute("role", "tab"); tab.id = "tab-" + p.id;
    tab.setAttribute("aria-controls", "panel-" + p.id); tab.textContent = p.title;
    tabs.appendChild(tab);

    const panel = document.createElement("div");
    panel.className = "panel"; panel.id = "panel-" + p.id; panel.setAttribute("role", "tabpanel");
    panel.setAttribute("aria-labelledby", tab.id);

    (p.groups || []).forEach((gid) => {
      const g = GROUPS.find((x) => x.id === gid);
      const card = document.createElement("section"); card.className = "card";
      const h = document.createElement("h2"); h.textContent = g.title; h.style.fontSize = "22px";
      card.appendChild(h);
      const grid = document.createElement("div"); grid.className = "fields";
      g.fields.forEach((f) => {
        const lab = document.createElement("label"); lab.htmlFor = "f-" + f.key;
        if (f.long) lab.className = "full";
        lab.appendChild(document.createTextNode(f.label));
        const input = document.createElement(f.long ? "textarea" : "input");
        if (!f.long) input.type = "text";
        input.id = "f-" + f.key; input.value = values[f.key];
        input.addEventListener("input", () => { values[f.key] = input.value; markDirty(); });
        lab.appendChild(input);
        if (f.hint) { const s = document.createElement("span"); s.className = "hint"; s.textContent = f.hint; lab.appendChild(s); }
        grid.appendChild(lab);
      });
      card.appendChild(grid); panel.appendChild(card);
    });

    if (p.note) { const n = document.createElement("div"); n.className = "msg info"; n.textContent = p.note; panel.appendChild(n); }

    (p.lists || []).forEach(([key, title]) => {
      const card = document.createElement("section"); card.className = "card";
      const h = document.createElement("h2"); h.textContent = title; h.style.fontSize = "22px";
      card.appendChild(h);
      if (key === "siswa" && p.siswaOption) {
        const lab = document.createElement("label"); lab.className = "check"; lab.htmlFor = "siswaPublic";
        const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "siswaPublic";
        cb.addEventListener("change", markDirty);
        const span = document.createElement("span");
        span.appendChild(document.createTextNode("Tampilkan nama siswa/i di website"));
        span.appendChild(document.createElement("br"));
        const hint = document.createElement("span"); hint.className = "hint";
        hint.textContent = "Kalau tidak dicentang, website hanya menampilkan jumlah siswa/i per paket. Daftar nama tetap tersimpan dan hanya admin yang bisa membacanya.";
        span.appendChild(hint);
        lab.appendChild(cb); lab.appendChild(span); card.appendChild(lab);
      }
      const wrap = document.createElement("div"); wrap.className = "tbl";
      const table = document.createElement("table"); table.id = "t-" + key; wrap.appendChild(table);
      card.appendChild(wrap);
      const add = document.createElement("div");
      const btn = document.createElement("button"); btn.type = "button"; btn.className = "btn line small"; btn.textContent = "Tambah baris";
      btn.addEventListener("click", () => { lists[key].push({}); markDirty(); renderList(key); });
      add.appendChild(btn); card.appendChild(add);
      panel.appendChild(card);
    });

    panels.appendChild(panel);
  });

  const tabEls = Array.from(tabs.querySelectorAll("[role=tab]"));
  function select(tab) {
    tabEls.forEach((t) => {
      const on = t === tab;
      t.setAttribute("aria-selected", on ? "true" : "false");
      t.tabIndex = on ? 0 : -1;
      $(t.getAttribute("aria-controls")).hidden = !on;
    });
  }
  tabEls.forEach((t, i) => {
    t.addEventListener("click", () => select(t));
    t.addEventListener("keydown", (e) => {
      const j = e.key === "ArrowRight" ? i + 1 : e.key === "ArrowLeft" ? i - 1 : -1;
      if (j < 0) return;
      e.preventDefault();
      const nt = tabEls[(j + tabEls.length) % tabEls.length]; select(nt); nt.focus();
    });
  });
  select(tabEls[0]);
}

function clean(rows, key) {
  const cols = LISTS[key].cols;
  return rows
    .map((r) => { const o = {}; cols.forEach(([f]) => { o[f] = String(r[f] || "").trim(); }); return o; })
    .filter((o) => Object.values(o).some(Boolean));
}

if (!configReady()) {
  $("setup").hidden = false;
} else {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let built = false;

  async function loadAll() {
    GROUPS.forEach((g) => g.fields.forEach((f) => { values[f.key] = f.def; }));
    const dataSnap = await getDoc(doc(db, "pkbm", "data"));
    const siteSnap = await getDoc(doc(db, "pkbm", "site"));
    const siswaSnap = await getDoc(doc(db, "admin", "siswa"));
    const data = dataSnap.exists() ? dataSnap.data() : {};
    const site = siteSnap.exists() ? siteSnap.data() : {};
    const texts = site.texts || {};
    Object.keys(texts).forEach((k) => { if (k in values && typeof texts[k] === "string") values[k] = texts[k]; });
    const copy = (a) => (a || []).map((r) => Object.assign({}, r));
    lists.pengurus = copy(data.pengurus);
    lists.jadwal = copy(data.jadwal);
    lists.siswa = siswaSnap.exists() ? copy(siswaSnap.data().siswa) : [];
    lists.majelis = copy(site.majelis);
    lists.pemuda = copy(site.pemuda);
    lists.pengumuman = copy(site.pengumuman);
    if (!built) { buildPanels(); built = true; }
    else GROUPS.forEach((g) => g.fields.forEach((f) => { $("f-" + f.key).value = values[f.key]; }));
    $("siswaPublic").checked = data.siswaMode === "names";
    Object.keys(lists).forEach(renderList);
    dirty = false;
  }

  onAuthStateChanged(auth, async (user) => {
    $("loginCard").hidden = !!user;
    $("editor").hidden = !user;
    $("logout").hidden = !user;
    if (!user) return;
    show($("saveMsg"), "Memuat data...", "info");
    try {
      await loadAll();
      $("saveMsg").className = ""; $("saveMsg").textContent = "";
    } catch (err) {
      show($("saveMsg"), err && err.code === "permission-denied"
        ? "Akun ini belum terdaftar sebagai admin di aturan Firestore."
        : "Data belum bisa dimuat. Periksa koneksi lalu muat ulang.", "err");
    }
  });

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("loginBtn"); btn.disabled = true;
    show($("loginMsg"), "Memeriksa...", "info");
    try {
      await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
      $("loginMsg").className = ""; $("loginMsg").textContent = ""; $("password").value = "";
    } catch (err) {
      const code = err && err.code ? " (" + err.code + ")" : "";
      show($("loginMsg"), err && err.code === "auth/unauthorized-domain"
        ? "Domain website ini belum didaftarkan di Firebase (Authentication, Settings, Authorized domains)."
        : "Email atau kata sandi salah, atau login belum bisa diproses" + code + ".", "err");
    } finally { btn.disabled = false; }
  });

  $("resetBtn").addEventListener("click", async () => {
    const email = $("email").value.trim();
    if (!email) { show($("loginMsg"), "Isi email dulu, lalu tekan Lupa kata sandi.", "err"); return; }
    try {
      await sendPasswordResetEmail(auth, email);
      show($("loginMsg"), "Jika email terdaftar, tautan untuk mengatur ulang kata sandi sudah dikirim.", "ok");
    } catch (err) {
      show($("loginMsg"), "Tautan belum bisa dikirim. Periksa alamat email.", "err");
    }
  });

  $("logout").addEventListener("click", () => signOut(auth));

  $("saveBtn").addEventListener("click", async () => {
    const btn = $("saveBtn"); btn.disabled = true;
    show($("saveMsg"), "Menyimpan...", "info");
    try {
      const texts = {};
      GROUPS.forEach((g) => g.fields.forEach((f) => {
        const v = String(values[f.key] || "").trim();
        if (v && v !== f.def) texts[f.key] = v;
      }));
      const pengurus = clean(lists.pengurus, "pengurus");
      const jadwal = clean(lists.jadwal, "jadwal");
      const siswa = clean(lists.siswa, "siswa");
      const majelis = clean(lists.majelis, "majelis");
      const pemuda = clean(lists.pemuda, "pemuda");
      const pengumuman = clean(lists.pengumuman, "pengumuman");
      const siswaCount = {};
      siswa.forEach((s) => { const k = s.paket || "Lainnya"; siswaCount[k] = (siswaCount[k] || 0) + 1; });
      const showNames = $("siswaPublic").checked;
      await setDoc(doc(db, "admin", "siswa"), { siswa, updatedAt: serverTimestamp() });
      await setDoc(doc(db, "pkbm", "data"), {
        pengurus, jadwal, siswaCount,
        siswaMode: showNames ? "names" : "count",
        siswa: showNames ? siswa : [],
        updatedAt: serverTimestamp()
      });
      await setDoc(doc(db, "pkbm", "site"), { texts, majelis, pemuda, pengumuman, updatedAt: serverTimestamp() });
      lists.pengurus = pengurus; lists.jadwal = jadwal; lists.siswa = siswa;
      lists.majelis = majelis; lists.pemuda = pemuda; lists.pengumuman = pengumuman;
      Object.keys(lists).forEach(renderList);
      dirty = false;
      show($("saveMsg"), "Tersimpan. Website sudah diperbarui.", "ok");
    } catch (err) {
      show($("saveMsg"), err && err.code === "permission-denied"
        ? "Ditolak. Akun ini belum terdaftar sebagai admin di aturan Firestore."
        : "Gagal menyimpan. Periksa koneksi lalu coba lagi.", "err");
    } finally { btn.disabled = false; }
  });
}
</script>
</body>
</html>
