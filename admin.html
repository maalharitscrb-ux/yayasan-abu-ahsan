<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin Yayasan Abu Ahsan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #121212; --teal: #8A6210; --teal-dark: #6B4A0B; --mint: #F6EED8; --gold: #E2A826;
  --paper: #FAF8F2; --white: #FFFFFF; --muted: #5A5648; --line: #E6DCC0; --danger: #A3261C;
  --display: "Source Serif 4", Georgia, serif;
  --body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
h1, h2 { font-family: var(--display); margin: 0; line-height: 1.2; text-wrap: balance; }
a { color: var(--teal-dark); }
button, input, select { font: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
header { background: var(--ink); color: #fff; }
header .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; padding-bottom: 16px; }
header h1 { font-size: 22px; }
header a { color: var(--gold); }
main { padding: 32px 0 64px; display: grid; gap: 28px; }
.card { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 14px; }
.login { max-width: 420px; margin: 0 auto; }
label { display: grid; gap: 4px; font-weight: 600; font-size: 15px; }
input, select { padding: 10px 12px; border: 1px solid #C9BD98; border-radius: 8px; background: #fff; color: var(--ink); width: 100%; min-width: 0; }
.btn { display: inline-block; border: 2px solid transparent; border-radius: 8px; padding: 10px 18px; font-weight: 600; cursor: pointer; background: var(--ink); color: #fff; }
.btn:hover { background: #2B2B2B; }
.btn.gold { background: var(--gold); color: #1A1405; }
.btn.gold:hover { background: #F0BC45; }
.btn.line { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.line:hover { background: var(--mint); }
.btn.small { padding: 6px 12px; font-size: 14px; }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.msg { padding: 10px 14px; border-radius: 8px; font-size: 15px; }
.msg.err { background: #FBE9E7; color: var(--danger); }
.msg.ok { background: #E7F4E4; color: #20551A; }
.msg.info { background: var(--mint); color: var(--teal-dark); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { background: var(--mint); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--teal-dark); }
tbody tr:last-child td { border-bottom: 0; }
td.empty { color: var(--muted); text-align: center; padding: 22px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; }
.check input { width: 20px; height: 20px; margin-top: 3px; flex: none; }
.hint { color: var(--muted); font-size: 14px; }
.savebar { position: sticky; bottom: 0; background: rgba(250,248,242,.96); border-top: 1px solid var(--line); padding: 12px 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Admin Yayasan Abu Ahsan</h1>
    <div class="row"><a href="index.html">Lihat website</a><button type="button" class="btn line small" id="logout" hidden style="color:#fff;border-color:#fff">Keluar</button></div>
  </div>
</header>

<main class="wrap">
  <div id="setup" class="msg err" hidden>Firebase belum dikonfigurasi. Isi file <b>firebase-config.js</b> dulu, lalu muat ulang halaman ini.</div>

  <section class="card login" id="loginCard" hidden>
    <h2>Masuk admin</h2>
    <form id="loginForm" novalidate>
      <div style="display:grid;gap:14px">
        <label for="email">Email<input id="email" type="email" autocomplete="username" required></label>
        <label for="password">Kata sandi<input id="password" type="password" autocomplete="current-password" required></label>
        <div class="row">
          <button type="submit" class="btn gold" id="loginBtn">Masuk</button>
          <button type="button" class="btn line" id="resetBtn">Lupa kata sandi</button>
        </div>
        <div id="loginMsg" role="status"></div>
      </div>
    </form>
  </section>

  <div id="editor" hidden style="display:grid;gap:28px">
    <div class="msg info">Ubah data di bawah, lalu tekan <b>Simpan ke website</b>. Perubahan langsung tampil di tab PKBM.</div>

    <section class="card" aria-labelledby="h-pengurus">
      <h2 id="h-pengurus">Pengurus PKBM</h2>
      <div class="tbl"><table id="t-pengurus"></table></div>
      <div><button type="button" class="btn line small" data-add="pengurus">Tambah baris</button></div>
    </section>

    <section class="card" aria-labelledby="h-siswa">
      <h2 id="h-siswa">Siswa/i</h2>
      <label class="check" for="siswaPublic"><input type="checkbox" id="siswaPublic"><span>Tampilkan nama siswa/i di website<br><span class="hint">Kalau tidak dicentang, website hanya menampilkan jumlah siswa/i per paket. Daftar nama tetap tersimpan, hanya admin yang bisa membacanya.</span></span></label>
      <div class="tbl"><table id="t-siswa"></table></div>
      <div><button type="button" class="btn line small" data-add="siswa">Tambah baris</button></div>
    </section>

    <section class="card" aria-labelledby="h-jadwal">
      <h2 id="h-jadwal">Jadwal pembelajaran</h2>
      <div class="tbl"><table id="t-jadwal"></table></div>
      <div><button type="button" class="btn line small" data-add="jadwal">Tambah baris</button></div>
    </section>

    <div class="savebar">
      <div class="row">
        <button type="button" class="btn gold" id="saveBtn">Simpan ke website</button>
        <span id="saveMsg" role="status"></span>
      </div>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, configReady } from "./firebase-config.js";

const $ = (id) => document.getElementById(id);
const PAKET = ["", "Paket B", "Paket C"];
const SECTIONS = {
  pengurus: { cols: [["nama", "Nama"], ["jabatan", "Jabatan"]] },
  siswa:    { cols: [["nama", "Nama"], ["paket", "Paket", PAKET], ["kelas", "Kelas"]] },
  jadwal:   { cols: [["hari", "Hari"], ["jam", "Jam"], ["mapel", "Mata pelajaran"], ["paket", "Paket", PAKET], ["pengajar", "Pengajar"]] }
};
const state = { pengurus: [], siswa: [], jadwal: [] };

function show(el, text, kind) {
  el.className = "msg " + kind;
  el.textContent = text;
}

function renderSection(key) {
  const table = $("t-" + key), cfg = SECTIONS[key];
  while (table.firstChild) table.removeChild(table.firstChild);
  const thead = document.createElement("thead"), hr = document.createElement("tr");
  cfg.cols.forEach(([, label]) => { const th = document.createElement("th"); th.scope = "col"; th.textContent = label; hr.appendChild(th); });
  const thx = document.createElement("th"); thx.scope = "col"; thx.textContent = "Aksi"; hr.appendChild(thx);
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = document.createElement("tbody");
  if (!state[key].length) {
    const tr = document.createElement("tr"), td = document.createElement("td");
    td.className = "empty"; td.colSpan = cfg.cols.length + 1; td.textContent = "Belum ada data. Tekan Tambah baris.";
    tr.appendChild(td); tbody.appendChild(tr);
  }
  state[key].forEach((row, i) => {
    const tr = document.createElement("tr");
    cfg.cols.forEach(([field, label, options]) => {
      const td = document.createElement("td");
      let input;
      if (options) {
        input = document.createElement("select");
        options.forEach((o) => { const op = document.createElement("option"); op.value = o; op.textContent = o || "Pilih paket"; input.appendChild(op); });
      } else {
        input = document.createElement("input"); input.type = "text";
      }
      input.value = row[field] || "";
      input.setAttribute("aria-label", label + " baris " + (i + 1));
      input.addEventListener("input", () => { row[field] = input.value; });
      input.addEventListener("change", () => { row[field] = input.value; });
      td.appendChild(input); tr.appendChild(td);
    });
    const tdx = document.createElement("td");
    const del = document.createElement("button");
    del.type = "button"; del.className = "btn danger small"; del.textContent = "Hapus";
    del.addEventListener("click", () => { state[key].splice(i, 1); renderSection(key); });
    tdx.appendChild(del); tr.appendChild(tdx); tbody.appendChild(tr);
  });
  table.appendChild(tbody);
}

function clean(rows, cols) {
  return rows
    .map((r) => { const o = {}; cols.forEach(([f]) => { o[f] = String(r[f] || "").trim(); }); return o; })
    .filter((o) => Object.values(o).some(Boolean));
}

if (!configReady()) {
  $("setup").hidden = false;
} else {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, async (user) => {
    $("loginCard").hidden = !!user;
    $("editor").hidden = !user;
    $("logout").hidden = !user;
    if (!user) return;
    try {
      const pub = await getDoc(doc(db, "pkbm", "data"));
      const adm = await getDoc(doc(db, "admin", "siswa"));
      const d = pub.exists() ? pub.data() : {};
      state.pengurus = (d.pengurus || []).map((r) => Object.assign({}, r));
      state.jadwal = (d.jadwal || []).map((r) => Object.assign({}, r));
      state.siswa = adm.exists() ? (adm.data().siswa || []).map((r) => Object.assign({}, r)) : [];
      $("siswaPublic").checked = d.siswaMode === "names";
      Object.keys(SECTIONS).forEach(renderSection);
    } catch (err) {
      Object.keys(SECTIONS).forEach(renderSection);
      show($("saveMsg"), err && err.code === "permission-denied"
        ? "Akun ini belum terdaftar sebagai admin di firestore.rules."
        : "Data belum bisa dimuat. Periksa koneksi lalu muat ulang.", "err");
    }
  });

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("loginBtn"); btn.disabled = true;
    show($("loginMsg"), "Memeriksa...", "info");
    try {
      await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
      $("loginMsg").className = ""; $("loginMsg").textContent = ""; $("password").value = "";
    } catch (err) {
      show($("loginMsg"), "Email atau kata sandi salah. Periksa lalu coba lagi.", "err");
    } finally { btn.disabled = false; }
  });

  $("resetBtn").addEventListener("click", async () => {
    const email = $("email").value.trim();
    if (!email) { show($("loginMsg"), "Isi email dulu, lalu tekan Lupa kata sandi.", "err"); return; }
    try {
      await sendPasswordResetEmail(auth, email);
      show($("loginMsg"), "Jika email terdaftar, tautan untuk mengatur ulang kata sandi sudah dikirim.", "ok");
    } catch (err) {
      show($("loginMsg"), "Tautan belum bisa dikirim. Periksa alamat email.", "err");
    }
  });

  $("logout").addEventListener("click", () => signOut(auth));

  document.querySelectorAll("[data-add]").forEach((b) => b.addEventListener("click", () => {
    const key = b.getAttribute("data-add");
    state[key].push({});
    renderSection(key);
  }));

  $("saveBtn").addEventListener("click", async () => {
    const btn = $("saveBtn"); btn.disabled = true;
    show($("saveMsg"), "Menyimpan...", "info");
    try {
      const pengurus = clean(state.pengurus, SECTIONS.pengurus.cols);
      const jadwal = clean(state.jadwal, SECTIONS.jadwal.cols);
      const siswa = clean(state.siswa, SECTIONS.siswa.cols);
      const siswaCount = {};
      siswa.forEach((s) => { const k = s.paket || "Lainnya"; siswaCount[k] = (siswaCount[k] || 0) + 1; });
      const showNames = $("siswaPublic").checked;
      await setDoc(doc(db, "admin", "siswa"), { siswa, updatedAt: serverTimestamp() });
      await setDoc(doc(db, "pkbm", "data"), {
        pengurus, jadwal, siswaCount,
        siswaMode: showNames ? "names" : "count",
        siswa: showNames ? siswa : [],
        updatedAt: serverTimestamp()
      });
      state.pengurus = pengurus; state.jadwal = jadwal; state.siswa = siswa;
      Object.keys(SECTIONS).forEach(renderSection);
      show($("saveMsg"), "Tersimpan. Website sudah diperbarui.", "ok");
    } catch (err) {
      show($("saveMsg"), err && err.code === "permission-denied"
        ? "Ditolak. Akun ini belum terdaftar sebagai admin di firestore.rules."
        : "Gagal menyimpan. Periksa koneksi lalu coba lagi.", "err");
    } finally { btn.disabled = false; }
  });
}
</script>
</body>
</html>
